[project]
name = "reelmatch-movie-recommender"
version = "1.0.0"
description = "Hybrid item-based movie recommendations on MovieLens 100K"
requires-python = ">=3.10,<3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 120
exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
